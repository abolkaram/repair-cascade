<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Repair Cascade</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1114;color:#dce8e5;font:16px Arial}button,input,textarea{font:inherit}header{display:flex;justify-content:space-between;padding:20px 4vw}.hero{padding:7vh 5vw}.hero h1{font:900 clamp(4rem,11vw,10rem)/.75 Arial Black;margin:0}.map{min-height:70vh;position:relative;padding:8vh 8vw}.branch{display:grid;grid-template-columns:repeat(3,1fr);gap:10vw;position:relative}.branch:before{content:"";position:absolute;left:16%;right:16%;top:75px;height:7px;background:#ff4c43}.node{aspect-ratio:1;border-radius:50%;background:#1b2428;border:10px solid #ff4c43;display:grid;place-items:center;text-align:center;z-index:1;padding:15px;font-weight:bold}.node.done{border-color:#57f0ae}.controls{text-align:center;margin-top:50px}.controls button{background:#57f0ae;border:0;padding:12px;font-weight:bold}.console{padding:6vh 5vw;background:#1b2428}.reader{display:flex}.reader input{flex:1;padding:11px}.status{font:12px monospace;color:#57f0ae}pre{white-space:pre-wrap;background:#090c0e;padding:18px}.overlay{position:fixed;z-index:5;inset:0;background:#ff4c43;color:#111;padding:5vh 7vw;clip-path:circle(0 at 100% 100%);transition:.5s;overflow:auto}.overlay.open{clip-path:circle(150% at 100% 100%)}.overlay h2{font:900 4rem Arial Black}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.wide{grid-column:1/-1}.field input,.field textarea{padding:11px;border:0}.close{float:right}.go{background:#111;color:white;border:0;padding:13px;margin-top:15px}@media(max-width:650px){.branch{grid-template-columns:1fr}.branch:before{left:50%;right:auto;top:5%;bottom:5%;width:7px;height:auto}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}</style></head><body><header><b>REPAIR CASCADE / FAULT MAP</b><button id="connect">CONNECT</button></header><section class="hero"><h1>STOP THE<br>CASCADE.</h1></section><main class="map" id="faultMap"><div class="branch"><div class="node">FREEZE</div><div class="node">REPAIR</div><div class="node">REOPEN</div></div><div class="controls"><button id="openNew">DRAW INCIDENT GRAPH</button><button id="proofOpen">VERIFY UNLOCKED NODE</button><button id="expire">EXPIRE</button></div></main><section class="console"><div class="reader"><input id="active" placeholder="Incident ID"><button id="read">TRACE</button></div><p id="status" class="status">DEPLOYMENT PENDING REVIEW</p><pre id="output">No cascade traced.</pre></section><section class="overlay" id="newOverlay"><button class="close">×</button><h2>Wire the dependency graph.</h2><form id="newForm"><div class="grid"><div class="field"><label>ID</label><input id="id" required></div><div class="field"><label>TITLE</label><input id="title" required></div><div class="field wide"><label>NODES / ONE PER LINE</label><textarea id="nodes" required></textarea></div><div class="field wide"><label>PARENT INDEXES / -1 FOR ROOT</label><input id="parents" required placeholder="-1,0,1"></div><div class="field wide"><label>VERIFIER WALLETS / ONE PER LINE</label><textarea id="verifiers" required></textarea></div><div class="field"><label>DEADLINE SECONDS</label><input id="window" type="number" value="86400"></div></div><button class="go">OPEN INCIDENT</button></form></section><section class="overlay" id="nodeProof"><button class="close">×</button><h2>Seal one repaired node.</h2><form id="proofForm"><div class="field"><label>NODE INDEX</label><input id="index" type="number" min="0" required></div><details open><summary>ATTACH PUBLIC NODE PROOF</summary><input id="proof" type="url" required></details><button class="go">VERIFY + UNLOCK</button></form></section><script type="module">import{createClient}from'https://esm.sh/genlayer-js@1.1.8';import{studionet}from'https://esm.sh/genlayer-js@1.1.8/chains';const $=s=>document.querySelector(s),ADDRESS='CONTRACT_ADDRESS';let client;const open=id=>$(id).classList.add('open'),close=()=>document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('open')),status=t=>$('#status').textContent=t;async function connect(){const[a]=await ethereum.request({method:'eth_requestAccounts'});client=createClient({chain:studionet,account:a,provider:ethereum});await client.connect('studionet')}async function read(){if(!client)await connect();const x=await client.readContract({address:ADDRESS,functionName:'get_cascade',args:[$('#active').value]});$('#output').textContent=JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v,2);document.querySelectorAll('.node').forEach((n,i)=>n.classList.toggle('done',x.verified[i]))}async function write(fn,args){if(!client)await connect();const h=await client.writeContract({address:ADDRESS,functionName:fn,args,value:0n});status('WAITING FINALIZED');await client.waitForTransactionReceipt({hash:h,status:'FINALIZED',retries:180,interval:5000});status('FINALIZED '+h);await read()}$('#connect').onclick=connect;$('#openNew').onclick=()=>open('#newOverlay');$('#proofOpen').onclick=()=>open('#nodeProof');document.querySelectorAll('.close').forEach(b=>b.onclick=close);$('#newForm').onsubmit=e=>{e.preventDefault();$('#active').value=$('#id').value;write('open_incident',[$('#id').value,$('#title').value,$('#nodes').value.split('\n').filter(Boolean),$('#parents').value.split(',').map(Number),$('#verifiers').value.split('\n').filter(Boolean),Number($('#window').value)]).then(close)};$('#proofForm').onsubmit=e=>{e.preventDefault();write('verify_node',[$('#active').value,Number($('#index').value),$('#proof').value]).then(close)};$('#expire').onclick=()=>write('expire',[$('#active').value]);$('#read').onclick=read;</script></body></html>
